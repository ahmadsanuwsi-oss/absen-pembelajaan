crons:
  - name: daily-db-backup
    description: "Backup harian seluruh database (absensi, nilai, tahfidz, tabungan) tiap malam 01:00 WIB"
    cron: "0 1 * * *"
    timezone: "Asia/Jakarta"
    endpoint: "{{BASE_URL}}/api/cron/backup"
    method: POST
    # Cron endpoints must ack 2xx immediately; enqueue/background the actual work.
    enabled: true
